version: "3.9"
services:
  libretranslate:
    build: ./libretranslate
    container_name: libretranslate
    ports:
      - "5000:5000"

  bot:
    build: ./bot
    container_name: discordbot
    depends_on:
      - libretranslate
    environment:
      DISCORD_TOKEN: your_discord_token_here
    command: python bot.py
